<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the browser UI, Express server, route modules, library modules, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526078}
      .heading{font-size:15px;font-weight:700}.label{font-size:13px;font-weight:700}
      .small{font-size:12px}.tiny{font-size:12px;fill:#526078}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
      .blue{fill:#eff6ff;stroke:#60a5fa}.orange{fill:#fff7ed;stroke:#fb923c}.green{fill:#f0fdf4;stroke:#4ade80}
      .ticket{fill:#f3e8ff;stroke:#a855f7;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .flowline{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrowBlue)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="28" y="38" class="title">ShopLedger | Application architecture</text>
  <text x="28" y="61" class="subtitle">Browser POS · Express API · JSON-backed orders, inventory, Khata and GST reporting</text>

  <!-- Main architecture panels -->
  <rect x="24" y="82" width="200" height="390" rx="10" class="panel"/>
  <text x="40" y="108" class="heading">Browser UI</text>
  <text x="40" y="128" class="tiny">public/</text>
  <rect x="40" y="143" width="168" height="68" rx="7" class="box blue"/>
  <text x="52" y="166" class="label">index.html</text><text x="52" y="188" class="small">POS, orders, Khata, reports</text>
  <rect x="40" y="222" width="168" height="56" rx="7" class="box blue"/>
  <text x="52" y="245" class="label">js/app.js</text><text x="52" y="265" class="small">fetches /api/* endpoints</text>
  <rect x="40" y="289" width="168" height="48" rx="7" class="box blue"/>
  <text x="52" y="318" class="label">css/style.css</text>
  <path d="M124 211V221" class="line"/>
  <text x="40" y="373" class="small">Browser submits cart and coupon</text>
  <text x="40" y="394" class="small">for preview, then order creation.</text>
  <rect x="40" y="415" width="168" height="42" rx="7" class="ticket"/>
  <text x="52" y="441" class="label">Invoice link → printable HTML</text>

  <rect x="248" y="82" width="166" height="390" rx="10" class="panel"/>
  <text x="264" y="108" class="heading">HTTP server</text>
  <rect x="264" y="143" width="134" height="88" rx="7" class="box orange"/>
  <text x="277" y="168" class="label">server.js</text>
  <text x="277" y="189" class="small">Express app</text>
  <text x="277" y="208" class="small">static public/</text>
  <rect x="264" y="250" width="134" height="76" rx="7" class="ticket"/>
  <text x="276" y="274" class="label">GET invoice</text>
  <text x="276" y="295" class="small">orders/:id/invoice</text>
  <text x="276" y="314" class="small">render(order)</text>
  <path d="M224 250H263" class="flowline"/>
  <path d="M224 436H250V288H263" class="line"/>
  <text x="264" y="366" class="small">Mounts all routers</text>
  <text x="264" y="387" class="small">at /api; reads config</text>
  <text x="264" y="408" class="small">for port and shop info.</text>

  <rect x="438" y="82" width="234" height="390" rx="10" class="panel"/>
  <text x="454" y="108" class="heading">Route modules</text>
  <rect x="454" y="126" width="202" height="61" rx="7" class="box orange"/>
  <text x="466" y="148" class="label">routes/orders.js</text><text x="466" y="171" class="small">list · get · create · cancel</text>
  <rect x="454" y="198" width="202" height="55" rx="7" class="box orange"/>
  <text x="466" y="221" class="label">routes/products.js</text><text x="466" y="241" class="small">products · coupons</text>
  <rect x="454" y="264" width="202" height="55" rx="7" class="box orange"/>
  <text x="466" y="287" class="label">routes/customers.js</text><text x="466" y="307" class="small">customers · settle</text>
  <rect x="454" y="330" width="202" height="72" rx="7" class="box orange"/>
  <text x="466" y="352" class="label">routes/reports.js</text><text x="466" y="373" class="small">dashboard · GST reconciliation</text><text x="466" y="391" class="small">pricing preview · admin export</text>
  <path d="M414 186H453" class="flowline"/>
  <text x="454" y="436" class="tiny">All API routers mounted at /api</text>

  <rect x="696" y="82" width="292" height="390" rx="10" class="panel"/>
  <text x="712" y="108" class="heading">Business modules | lib/</text>
  <rect x="712" y="126" width="123" height="52" rx="7" class="box green"/><text x="723" y="148" class="label">pricing.js</text><text x="723" y="167" class="small">subtotal / totals</text>
  <rect x="849" y="126" width="123" height="52" rx="7" class="box green"/><text x="860" y="148" class="label">coupons.js</text><text x="860" y="167" class="small">validate / discount</text>
  <rect x="712" y="190" width="123" height="52" rx="7" class="box green"/><text x="723" y="212" class="label">tax.js</text><text x="723" y="231" class="small">HSN slabs / split</text>
  <rect x="849" y="190" width="123" height="52" rx="7" class="box green"/><text x="860" y="212" class="label">inventory.js</text><text x="860" y="231" class="small">check / reserve</text>
  <rect x="712" y="254" width="123" height="52" rx="7" class="box green"/><text x="723" y="276" class="label">orders.js</text><text x="723" y="295" class="small">add / get / cancel</text>
  <rect x="849" y="254" width="123" height="52" rx="7" class="box green"/><text x="860" y="276" class="label">ledger.js</text><text x="860" y="295" class="small">Khata / settlements</text>
  <rect x="712" y="318" width="123" height="52" rx="7" class="box green"/><text x="723" y="340" class="label">reports.js</text><text x="723" y="359" class="small">summary / reconcile</text>
  <rect x="849" y="318" width="123" height="52" rx="7" class="ticket"/><text x="860" y="340" class="label">invoice.js</text><text x="860" y="359" class="small">figures / HTML render</text>
  <rect x="712" y="382" width="123" height="52" rx="7" class="box green"/><text x="723" y="404" class="label">store.js</text><text x="723" y="423" class="small">read / write / audit</text>
  <rect x="849" y="382" width="123" height="52" rx="7" class="box green"/><text x="860" y="404" class="label">dates.js</text><text x="860" y="423" class="small">date helpers</text>
  <path d="M672 157H695" class="flowline"/>

  <rect x="1012" y="82" width="164" height="390" rx="10" class="panel"/>
  <text x="1028" y="108" class="heading">Runtime data</text>
  <rect x="1028" y="141" width="132" height="91" rx="7" class="box orange"/>
  <text x="1040" y="166" class="label">config.js</text>
  <text x="1040" y="188" class="small">shop · tax · coupons</text>
  <text x="1040" y="208" class="small">port · admin key</text>
  <rect x="1028" y="257" width="132" height="94" rx="7" class="box"/>
  <text x="1040" y="282" class="label">data/db.json</text>
  <text x="1040" y="304" class="small">products · orders</text>
  <text x="1040" y="324" class="small">customers · audit</text>
  <text x="1040" y="344" class="small">settlements · IDs</text>
  <path d="M988 410H1000V304H1027" class="line"/>
  <text x="1028" y="385" class="tiny">lib/store.js reads and writes</text>
  <text x="1028" y="405" class="tiny">the JSON file synchronously.</text>

  <!-- Main numbered order flow -->
  <rect x="24" y="492" width="1152" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="44" y="522" class="heading">Order placement flow</text>
  <text x="44" y="544" class="tiny">POST /api/orders · functions below are verified in source</text>
  <path d="M110 590H1070" class="flowline"/>
  <g><circle cx="110" cy="590" r="17" class="num"/><text x="110" y="590" class="numtext">1</text></g>
  <g><circle cx="300" cy="590" r="17" class="num"/><text x="300" y="590" class="numtext">2</text></g>
  <g><circle cx="490" cy="590" r="17" class="num"/><text x="490" y="590" class="numtext">3</text></g>
  <g><circle cx="680" cy="590" r="17" class="num"/><text x="680" y="590" class="numtext">4</text></g>
  <g><circle cx="870" cy="590" r="17" class="num"/><text x="870" y="590" class="numtext">5</text></g>
  <g><circle cx="1070" cy="590" r="17" class="num"/><text x="1070" y="590" class="numtext">6</text></g>
  <text x="58" y="625" class="label">Browser submits</text><text x="58" y="646" class="small">public/js/app.js</text><text x="58" y="666" class="small">items + coupon</text>
  <text x="244" y="625" class="label">Resolve &amp; check</text><text x="244" y="646" class="small">routes/orders.js</text><text x="244" y="666" class="small">inventory.find / check</text>
  <text x="434" y="625" class="label">Validate promotion</text><text x="434" y="646" class="small">coupons.normalizeCode</text><text x="434" y="666" class="small">coupons.validate</text>
  <text x="624" y="625" class="label">Compute checkout</text><text x="624" y="646" class="small">pricing.computeTotals</text><text x="624" y="666" class="small">tax.getRateForItem</text>
  <text x="814" y="625" class="label">Apply &amp; create</text><text x="814" y="646" class="small">ledger.chargeOrderToKhata*</text><text x="814" y="666" class="small">inventory.reserve · orders.add</text>
  <text x="1014" y="625" class="label">Persist order</text><text x="1014" y="646" class="small">appendAudit</text><text x="1014" y="666" class="small">store.write → db.json</text>
  <text x="44" y="714" class="small">*Khata debit runs only for Khata payment; cash orders skip it. Order lines store HSN but not gstRate.</text>
  <text x="44" y="738" class="small">Printable invoice path: server.js GET /orders/:id/invoice → orders.get → invoice.render → invoice.computeInvoiceFigures.</text>
  <rect x="799" y="716" width="13" height="13" rx="2" class="ticket"/><text x="820" y="728" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="979" y="716" width="13" height="13" rx="2" class="box green"/><text x="1000" y="728" class="small">lib/tax.js: checkout GST</text>
</svg>
